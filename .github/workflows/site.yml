name: Deploy website

# This site now owns the automatic deploy to the repo's GitHub Pages slot
# (9shrey.github.io/timeblock), replacing the app demo that pages.yml used to publish
# there automatically (pages.yml is still around, manual-dispatch only, if you want the
# demo back temporarily). No custom domain: nothing was purchased, and the free
# *.github.io-via-new-org route needs a human to create that org, so this deploys to
# the existing project Pages URL.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
