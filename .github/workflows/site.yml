name: Deploy website

# Manual dispatch only for now: this targets the same GitHub Pages deployment slot as
# pages.yml (which publishes the app build from gh-pages-source), and the two haven't
# been reconciled yet — see the website plan's open question on whether this site takes
# over the Pages root with the app moved under /app, gets its own custom domain, or
# something else. Wiring an automatic trigger here before that's decided would race
# pages.yml's deploy non-deterministically. Switch to `push: branches: [main]` (or
# whatever branch) once that's settled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
